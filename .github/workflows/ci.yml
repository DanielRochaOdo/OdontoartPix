name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - postgres-local-auth-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: odontoart_pix_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odontoart_pix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate deployment scripts
        shell: bash
        run: |
          bash -n deploy/systemd/install-app.sh
          bash -n deploy/systemd/install-worker.sh

      - name: Apply local PostgreSQL migrations
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: odontoart_pix_ci
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_SSL: "false"
        run: npm run db:migrate

      - name: Run production preflight in safe mode
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: odontoart_pix_ci
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_SSL: "false"
          AUTH_COOKIE_SECURE: "true"
          MENSALIDADES_API_BASE_URL: https://example.com
          MENSALIDADES_API_TOKEN: ci-token
          PROCESSING_ALLOW_SCHEDULED_SYNC: "false"
          PRODUCTION_PREFLIGHT_REQUIRE_SCHEDULER_OFF: "true"
        run: npm run preflight:production

      - name: Generate Next route types and typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop on typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Run tests
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: odontoart_pix_ci
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_SSL: "false"
          PROCESSING_ALLOW_SCHEDULED_SYNC: "false"
        run: npm run test

      - name: Build production bundle
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: odontoart_pix_ci
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_SSL: "false"
          AUTH_COOKIE_SECURE: "false"
          MENSALIDADES_API_BASE_URL: https://example.com
          MENSALIDADES_API_TOKEN: ci-token
          PROCESSING_ALLOW_SCHEDULED_SYNC: "false"
        run: npm run build
