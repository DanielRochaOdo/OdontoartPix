name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - postgres-local-auth-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: odontoart_pix_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odontoart_pix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: postgres-local-auth-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finalize definitive dashboard interrupt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/general-sync-button.tsx')
          text = path.read_text()
          if text.count('onClick={() => void pause()}') != 2:
              raise SystemExit('expected exactly two active dashboard pause controls')
          text = text.replace('onClick={() => void pause()}', 'onClick={() => void cancel()}')
          text = text.replace('disabled={pausing || cancelling || resuming}', 'disabled={cancelling || resuming}')
          text = text.replace('className="rounded-lg bg-amber-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-amber-700 disabled:cursor-not-allowed disabled:opacity-60"', 'className="rounded-lg bg-red-700 px-3 py-2 text-xs font-semibold text-white transition hover:bg-red-800 disabled:cursor-not-allowed disabled:opacity-60"')
          text = text.replace('className="rounded-lg bg-amber-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-amber-700 disabled:opacity-60"', 'className="rounded-lg bg-red-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-800 disabled:opacity-60"')
          text = text.replace('{pausing ? "Pausando..." : "Pausar sincronização"}', '{cancelling ? "Interrompendo..." : "Interromper processamento"}')
          text = text.replace('{pausing ? "Pausando..." : "Pausar sincronizacao"}', '{cancelling ? "Interrompendo..." : "Interromper processamento"}')
          path.write_text(text)
          PY
          if ! git diff --quiet -- src/components/general-sync-button.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/general-sync-button.tsx
            git commit -m "make dashboard interrupt definitive"
            git push origin HEAD:postgres-local-auth-foundation
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply local PostgreSQL migrations
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: odontoart_pix_ci
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_SSL: "false"
        run: npm run db:migrate

      - name: Generate Next route types and typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop on typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: odontoart_pix_ci
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_SSL: "false"
          AUTH_COOKIE_SECURE: "false"
          MENSALIDADES_API_BASE_URL: https://example.com
          MENSALIDADES_API_TOKEN: ci-token
          PROCESSING_ALLOW_SCHEDULED_SYNC: "false"
        run: npm run build
