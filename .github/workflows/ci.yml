name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - postgres-local-auth-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next route types and typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop on typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: npm run test

      - name: Build production bundle
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/odontoart_pix_ci
          SESSION_SECRET: ci-session-secret-with-at-least-32-characters
          MENSALIDADES_API_BASE_URL: https://example.com
          MENSALIDADES_API_TOKEN: ci-token
          PROCESSING_ALLOW_SCHEDULED_SYNC: "false"
        run: npm run build
