name: Patch dashboard interrupt semantics

on:
  push:
    branches:
      - postgres-local-auth-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'make dashboard interrupt definitive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: postgres-local-auth-foundation

      - name: Replace new-wave pause controls with definitive interrupt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/general-sync-button.tsx')
          text = path.read_text()
          old1 = '''                  <button
                    type="button"
                    onClick={() => void pause()}
                    disabled={pausing || cancelling || resuming}
                    className="rounded-lg bg-amber-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-amber-700 disabled:cursor-not-allowed disabled:opacity-60"
                  >
                    {pausing ? "Pausando..." : "Pausar sincronização"}
                  </button>'''
          new1 = '''                  <button
                    type="button"
                    onClick={() => void cancel()}
                    disabled={cancelling || resuming}
                    className="rounded-lg bg-red-700 px-3 py-2 text-xs font-semibold text-white transition hover:bg-red-800 disabled:cursor-not-allowed disabled:opacity-60"
                  >
                    {cancelling ? "Interrompendo..." : "Interromper processamento"}
                  </button>'''
          old2 = '''                  <button
                    type="button"
                    onClick={() => void pause()}
                    disabled={pausing || cancelling || resuming}
                    className="rounded-lg bg-amber-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-amber-700 disabled:opacity-60"
                  >
                    {pausing ? "Pausando..." : "Pausar sincronizacao"}
                  </button>'''
          new2 = '''                  <button
                    type="button"
                    onClick={() => void cancel()}
                    disabled={cancelling || resuming}
                    className="rounded-lg bg-red-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-800 disabled:opacity-60"
                  >
                    {cancelling ? "Interrompendo..." : "Interromper processamento"}
                  </button>'''
          if old1 not in text or old2 not in text:
              raise SystemExit('expected dashboard pause controls not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/components/general-sync-button.tsx; then
            echo "dashboard already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/general-sync-button.tsx
          git commit -m "make dashboard interrupt definitive"
          git push origin HEAD:postgres-local-auth-foundation
