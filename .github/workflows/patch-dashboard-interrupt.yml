name: Finalize secure runtime patch

on:
  push:
    branches:
      - postgres-local-auth-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'apply secure runtime and dashboard interrupt'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: postgres-local-auth-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Replace new-wave pause controls with definitive interrupt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/general-sync-button.tsx')
          text = path.read_text()
          replacements = [
            ('''                  <button
                    type="button"
                    onClick={() => void pause()}
                    disabled={pausing || cancelling || resuming}
                    className="rounded-lg bg-amber-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-amber-700 disabled:cursor-not-allowed disabled:opacity-60"
                  >
                    {pausing ? "Pausando..." : "Pausar sincronização"}
                  </button>''', '''                  <button
                    type="button"
                    onClick={() => void cancel()}
                    disabled={cancelling || resuming}
                    className="rounded-lg bg-red-700 px-3 py-2 text-xs font-semibold text-white transition hover:bg-red-800 disabled:cursor-not-allowed disabled:opacity-60"
                  >
                    {cancelling ? "Interrompendo..." : "Interromper processamento"}
                  </button>'''),
            ('''                  <button
                    type="button"
                    onClick={() => void pause()}
                    disabled={pausing || cancelling || resuming}
                    className="rounded-lg bg-amber-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-amber-700 disabled:opacity-60"
                  >
                    {pausing ? "Pausando..." : "Pausar sincronizacao"}
                  </button>''', '''                  <button
                    type="button"
                    onClick={() => void cancel()}
                    disabled={cancelling || resuming}
                    className="rounded-lg bg-red-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-red-800 disabled:opacity-60"
                  >
                    {cancelling ? "Interrompendo..." : "Interromper processamento"}
                  </button>''')
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
          if not changed and 'Interromper processamento' not in text:
              raise SystemExit('dashboard interrupt controls could not be located')
          path.write_text(text)
          PY

      - name: Refresh lock for Next 16
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only || true

      - name: Commit final generated changes
        shell: bash
        run: |
          if git diff --quiet -- src/components/general-sync-button.tsx package-lock.json; then
            echo "generated changes already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/general-sync-button.tsx package-lock.json
          git commit -m "apply secure runtime and dashboard interrupt"
          git push origin HEAD:postgres-local-auth-foundation
