name: Process Batches

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: scheduler
      campaign_id:
        description: Campaign identifier
        required: false
        default: ""
      batch_id:
        description: Batch identifier
        required: false
        default: ""
      requested_by:
        description: Requested by profile id
        required: false
        default: ""
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: process-batches-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate scheduler secrets
        env:
          PROCESS_BATCHES_URL: ${{ secrets.PROCESS_BATCHES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROCESS_BATCHES_URL" ]; then
            echo "GitHub secret PROCESS_BATCHES_URL is required."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "GitHub secret CRON_SECRET is required."
            exit 1
          fi

      - name: Trigger processing endpoint
        id: trigger_processing
        env:
          PROCESS_BATCHES_URL: ${{ secrets.PROCESS_BATCHES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error
          import socket

          url = os.environ["PROCESS_BATCHES_URL"]
          token = os.environ["CRON_SECRET"]
          max_calls = 240
          final_status = "idle"
          final_calls = 0

          def call_endpoint():
            req = urllib.request.Request(
              url,
              headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/json",
                "User-Agent": "odontoartpix-process-batches-workflow",
              },
              method="GET",
            )
            try:
              with urllib.request.urlopen(req, timeout=55) as response:
                payload = json.loads(response.read().decode("utf-8"))
                return payload
            except urllib.error.HTTPError as error:
              if error.code in (502, 503, 504):
                return {
                  "success": True,
                  "data": {
                    "status": "queued",
                    "lastStatus": "queued",
                    "note": f"gateway-http-{error.code}"
                  }
                }
              raise
            except socket.timeout:
              return {
                "success": True,
                "data": {
                  "status": "queued",
                  "lastStatus": "queued",
                  "note": "socket-timeout"
                }
              }

          for index in range(1, max_calls + 1):
            payload = call_endpoint()
            print(json.dumps({"call": index, "payload": payload}, ensure_ascii=False))
            final_calls = index

            if not payload.get("success"):
              raise SystemExit("Processing endpoint returned success=false.")

            data = payload.get("data") or {}
            status = data.get("lastStatus") or data.get("status") or "idle"
            final_status = status

            if status in ("idle", "failed", "paused"):
              break

            time.sleep(0.25)

          needs_continuation = "true" if final_status == "queued" else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"final_status={final_status}\n")
            output.write(f"final_calls={final_calls}\n")
            output.write(f"needs_continuation={needs_continuation}\n")
          PY

      - name: Dispatch continuation
        if: steps.trigger_processing.outputs.needs_continuation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_ID: process-batches.yml
          REF_NAME: ${{ github.ref_name }}
          INPUT_SOURCE: ${{ github.event.inputs.source || 'scheduler' }}
          INPUT_CAMPAIGN_ID: ${{ github.event.inputs.campaign_id || '' }}
          INPUT_BATCH_ID: ${{ github.event.inputs.batch_id || '' }}
          INPUT_REQUESTED_BY: ${{ github.event.inputs.requested_by || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          workflow_id = os.environ["WORKFLOW_ID"]
          ref_name = os.environ["REF_NAME"]
          token = os.environ["GH_TOKEN"]

          body = json.dumps({
            "ref": ref_name,
            "inputs": {
              "source": os.environ.get("INPUT_SOURCE", "scheduler"),
              "campaign_id": os.environ.get("INPUT_CAMPAIGN_ID", ""),
              "batch_id": os.environ.get("INPUT_BATCH_ID", ""),
              "requested_by": os.environ.get("INPUT_REQUESTED_BY", "")
            }
          }).encode("utf-8")

          req = urllib.request.Request(
            f"https://api.github.com/repos/{repository}/actions/workflows/{workflow_id}/dispatches",
            data=body,
            headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "odontoartpix-process-batches-workflow"
            },
            method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as response:
            print(f"Continuation dispatched with status {response.status}")
          PY
