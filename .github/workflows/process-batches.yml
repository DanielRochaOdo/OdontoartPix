name: Process Batches

on:
  # Nao existe mais cron periodico no GitHub. Acoes do usuario despacham este
  # workflow imediatamente e o Supabase Cron o despacha somente quando
  # processing_scheduler_state.next_run_at vencer.
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: scheduler
      campaign_id:
        description: Campaign identifier
        required: false
        default: ""
      batch_id:
        description: Batch identifier
        required: false
        default: ""
      requested_by:
        description: Requested by profile id
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: process-batches-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      # Somente o dispatch do scheduler pode criar uma nova onda automatica.
      # Campanha, lote, associado, erros e dashboard apenas consomem o trabalho
      # explicitamente solicitado pelo usuario.
      PROCESSING_ALLOW_SCHEDULED_SYNC: ${{ github.event.inputs.source == 'scheduler' && 'true' || 'false' }}

    steps:
      - name: Validate direct durable worker secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENSALIDADES_API_BASE_URL: ${{ secrets.MENSALIDADES_API_BASE_URL }}
          MENSALIDADES_API_TOKEN: ${{ secrets.MENSALIDADES_API_TOKEN }}
          PROCESSING_SYSTEM_USER_ID: ${{ secrets.PROCESSING_SYSTEM_USER_ID }}
        shell: bash
        run: |
          missing=0
          for name in \
            NEXT_PUBLIC_SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY \
            MENSALIDADES_API_BASE_URL \
            MENSALIDADES_API_TOKEN \
            PROCESSING_SYSTEM_USER_ID
          do
            if [ -z "${!name}" ]; then
              echo "Missing required Production secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Direct durable worker is mandatory. Vercel processing fallback is disabled to protect Fluid Active CPU usage."
            exit 1
          fi

          echo "Using direct GitHub durable worker."
          echo "Trigger source: ${{ github.event.inputs.source }}"
          echo "Scheduled sync allowed: $PROCESSING_ALLOW_SCHEDULED_SYNC"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run durable worker directly
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENSALIDADES_API_BASE_URL: ${{ secrets.MENSALIDADES_API_BASE_URL }}
          MENSALIDADES_API_TOKEN: ${{ secrets.MENSALIDADES_API_TOKEN }}
          PROCESSING_SYSTEM_USER_ID: ${{ secrets.PROCESSING_SYSTEM_USER_ID }}
          PROCESSING_WORKER_COUNT: ${{ vars.PROCESSING_WORKER_COUNT }}
          PROCESSING_BLOCK_SIZE: ${{ vars.PROCESSING_BLOCK_SIZE }}
          PROCESSING_CONCURRENCY: ${{ vars.PROCESSING_CONCURRENCY }}
          PROCESSING_ERP_CONCURRENCY: ${{ vars.PROCESSING_ERP_CONCURRENCY }}
          PROCESSING_ALLOW_SCHEDULED_SYNC: ${{ env.PROCESSING_ALLOW_SCHEDULED_SYNC }}
        run: npx --yes tsx@4.20.5 scripts/process-batches-worker.ts
