name: Process Batches

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: scheduler
      campaign_id:
        description: Campaign identifier
        required: false
        default: ""
      batch_id:
        description: Batch identifier
        required: false
        default: ""
      requested_by:
        description: Requested by profile id
        required: false
        default: ""
  schedule:
    # Pulso de recuperacao. A janela efetiva da sincronizacao agendada
    # continua sendo controlada transacionalmente no banco.
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: process-batches-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      # Em producao o worker pode iniciar a sincronizacao agendada conforme
      # a janela configurada no banco. O valor false fica restrito a testes locais.
      PROCESSING_ALLOW_SCHEDULED_SYNC: "true"

    steps:
      - name: Validate direct durable worker secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENSALIDADES_API_BASE_URL: ${{ secrets.MENSALIDADES_API_BASE_URL }}
          MENSALIDADES_API_TOKEN: ${{ secrets.MENSALIDADES_API_TOKEN }}
          PROCESSING_SYSTEM_USER_ID: ${{ secrets.PROCESSING_SYSTEM_USER_ID }}
        shell: bash
        run: |
          missing=0
          for name in \
            NEXT_PUBLIC_SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY \
            MENSALIDADES_API_BASE_URL \
            MENSALIDADES_API_TOKEN \
            PROCESSING_SYSTEM_USER_ID
          do
            if [ -z "${!name}" ]; then
              echo "Missing required Production secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Direct durable worker is mandatory. Vercel processing fallback is disabled to protect Fluid Active CPU usage."
            exit 1
          fi

          echo "Using direct GitHub durable worker."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run durable worker directly
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENSALIDADES_API_BASE_URL: ${{ secrets.MENSALIDADES_API_BASE_URL }}
          MENSALIDADES_API_TOKEN: ${{ secrets.MENSALIDADES_API_TOKEN }}
          PROCESSING_SYSTEM_USER_ID: ${{ secrets.PROCESSING_SYSTEM_USER_ID }}
          PROCESSING_WORKER_COUNT: ${{ vars.PROCESSING_WORKER_COUNT }}
          PROCESSING_BLOCK_SIZE: ${{ vars.PROCESSING_BLOCK_SIZE }}
          PROCESSING_CONCURRENCY: ${{ vars.PROCESSING_CONCURRENCY }}
          PROCESSING_ERP_CONCURRENCY: ${{ vars.PROCESSING_ERP_CONCURRENCY }}
        run: npx --yes tsx@4.20.5 scripts/process-batches-worker.ts
