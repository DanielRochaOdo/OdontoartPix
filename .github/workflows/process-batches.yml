name: Process Batches

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: scheduler
      campaign_id:
        description: Campaign identifier
        required: false
        default: ""
      batch_id:
        description: Batch identifier
        required: false
        default: ""
      requested_by:
        description: Requested by profile id
        required: false
        default: ""
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: process-batches-scheduler
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Production
    env:
      # Em producao o worker pode iniciar a sincronizacao agendada conforme
      # a janela configurada no banco. O valor false fica restrito a testes locais.
      PROCESSING_ALLOW_SCHEDULED_SYNC: "true"

    steps:
      - name: Detect durable worker mode
        id: worker_mode
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENSALIDADES_API_BASE_URL: ${{ secrets.MENSALIDADES_API_BASE_URL }}
          MENSALIDADES_API_TOKEN: ${{ secrets.MENSALIDADES_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] \
             && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] \
             && [ -n "$MENSALIDADES_API_BASE_URL" ] \
             && [ -n "$MENSALIDADES_API_TOKEN" ]; then
            echo "direct=true" >> "$GITHUB_OUTPUT"
            echo "Using direct GitHub durable worker."
          else
            echo "direct=false" >> "$GITHUB_OUTPUT"
            echo "Direct worker secrets are incomplete; using Vercel endpoint fallback."
          fi

      - name: Checkout
        if: steps.worker_mode.outputs.direct == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.worker_mode.outputs.direct == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.worker_mode.outputs.direct == 'true'
        run: npm ci

      - name: Run durable worker directly
        if: steps.worker_mode.outputs.direct == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENSALIDADES_API_BASE_URL: ${{ secrets.MENSALIDADES_API_BASE_URL }}
          MENSALIDADES_API_TOKEN: ${{ secrets.MENSALIDADES_API_TOKEN }}
          PROCESSING_SYSTEM_USER_ID: ${{ secrets.PROCESSING_SYSTEM_USER_ID }}
          PROCESSING_WORKER_COUNT: ${{ vars.PROCESSING_WORKER_COUNT }}
          PROCESSING_BLOCK_SIZE: ${{ vars.PROCESSING_BLOCK_SIZE }}
          PROCESSING_CONCURRENCY: ${{ vars.PROCESSING_CONCURRENCY }}
          PROCESSING_ERP_CONCURRENCY: ${{ vars.PROCESSING_ERP_CONCURRENCY }}
        run: npx --yes tsx@4.20.5 scripts/process-batches-worker.ts

      - name: Validate fallback secrets
        if: steps.worker_mode.outputs.direct != 'true'
        env:
          PROCESS_BATCHES_URL: ${{ secrets.PROCESS_BATCHES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROCESSING_SYSTEM_USER_ID: ${{ secrets.PROCESSING_SYSTEM_USER_ID }}
        run: |
          if [ -z "$PROCESS_BATCHES_URL" ]; then
            echo "GitHub secret PROCESS_BATCHES_URL is required for fallback mode."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "GitHub secret CRON_SECRET is required for fallback mode."
            exit 1
          fi
          if [ -z "$PROCESSING_SYSTEM_USER_ID" ]; then
            echo "GitHub secret PROCESSING_SYSTEM_USER_ID is required."
            exit 1
          fi

      - name: Trigger Vercel processing endpoint fallback
        if: steps.worker_mode.outputs.direct != 'true'
        id: trigger_processing
        env:
          PROCESS_BATCHES_URL: ${{ secrets.PROCESS_BATCHES_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROCESSING_SYSTEM_USER_ID: ${{ secrets.PROCESSING_SYSTEM_USER_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error
          import socket

          url = os.environ["PROCESS_BATCHES_URL"]
          token = os.environ["CRON_SECRET"]
          max_calls = 60
          final_status = "idle"
          final_calls = 0

          def call_endpoint():
            req = urllib.request.Request(
              url,
              headers={
                "Authorization": f"Bearer {token}",
                "X-Processing-System-User-Id": os.environ["PROCESSING_SYSTEM_USER_ID"],
                "Accept": "application/json",
                "User-Agent": "odontoartpix-process-batches-workflow",
              },
              method="GET",
            )
            try:
              with urllib.request.urlopen(req, timeout=115) as response:
                return json.loads(response.read().decode("utf-8"))
            except urllib.error.HTTPError as error:
              if error.code in (502, 503, 504):
                return {
                  "success": True,
                  "data": {
                    "status": "queued",
                    "lastStatus": "queued",
                    "note": f"gateway-http-{error.code}"
                  }
                }
              response_body = error.read().decode("utf-8", errors="replace")
              print(json.dumps({
                "http_status": error.code,
                "response_body": response_body[:4000]
              }, ensure_ascii=False))
              raise
            except socket.timeout:
              return {
                "success": True,
                "data": {
                  "status": "queued",
                  "lastStatus": "queued",
                  "note": "socket-timeout"
                }
              }

          for index in range(1, max_calls + 1):
            payload = call_endpoint()
            print(json.dumps({"call": index, "payload": payload}, ensure_ascii=False))
            final_calls = index

            if not payload.get("success"):
              raise SystemExit("Processing endpoint returned success=false.")

            data = payload.get("data") or {}
            status = data.get("lastStatus") or data.get("status") or "idle"
            final_status = status

            if status in ("idle", "failed", "paused"):
              break

            time.sleep(1)

          needs_continuation = "true" if final_status == "queued" else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"final_status={final_status}\n")
            output.write(f"final_calls={final_calls}\n")
            output.write(f"needs_continuation={needs_continuation}\n")
          PY

      - name: Dispatch fallback continuation
        if: steps.worker_mode.outputs.direct != 'true' && steps.trigger_processing.outputs.needs_continuation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_ID: process-batches.yml
          REF_NAME: ${{ github.ref_name }}
          INPUT_SOURCE: ${{ github.event.inputs.source || 'scheduler' }}
          INPUT_CAMPAIGN_ID: ${{ github.event.inputs.campaign_id || '' }}
          INPUT_BATCH_ID: ${{ github.event.inputs.batch_id || '' }}
          INPUT_REQUESTED_BY: ${{ github.event.inputs.requested_by || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          workflow_id = os.environ["WORKFLOW_ID"]
          ref_name = os.environ["REF_NAME"]
          token = os.environ["GH_TOKEN"]

          body = json.dumps({
            "ref": ref_name,
            "inputs": {
              "source": os.environ.get("INPUT_SOURCE", "scheduler"),
              "campaign_id": os.environ.get("INPUT_CAMPAIGN_ID", ""),
              "batch_id": os.environ.get("INPUT_BATCH_ID", ""),
              "requested_by": os.environ.get("INPUT_REQUESTED_BY", "")
            }
          }).encode("utf-8")

          req = urllib.request.Request(
            f"https://api.github.com/repos/{repository}/actions/workflows/{workflow_id}/dispatches",
            data=body,
            headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "odontoartpix-process-batches-workflow"
            },
            method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as response:
            print(f"Continuation dispatched with status {response.status}")
          PY
