name: Revisao complementar 048

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: complement-048-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complement:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/incremental-batch-totals-official-048'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        scenario: [delete-after-lock, delete-before-lock-047, delete-before-lock-048, import, cancel, deployment]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: odontoart_pix_ops048
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d odontoart_pix_ops048"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: odontoart_pix_ops048
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL: "false"
      OPERATIONAL048_ISOLATED: "yes"
      PROCESSING_ALLOW_SCHEDULED_SYNC: "false"
      CI048_COMPLEMENT: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create restricted app role
        env:
          CI_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$CI_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d odontoart_pix_ops048 -c "create role odontoart_pix_app login password 'ci-ops048-app' nosuperuser nocreatedb nocreaterole noinherit noreplication"
      - name: Validate harness syntax
        run: |
          node --check scripts/ci-048-complement.mjs
          node --check scripts/ci-048-operational-smoke.mjs
      - name: Apply migrations as administrator
        if: matrix.scenario != 'deployment'
        run: npm run db:migrate
      - name: Execute independent operational scenario
        if: matrix.scenario != 'deployment'
        run: node scripts/ci-048-operational-smoke.mjs
      - name: Simulate administrative installation and preflight compatibility
        if: matrix.scenario == 'deployment'
        env:
          CI_PG_CONTAINER: ${{ job.services.postgres.id }}
          AUTH_COOKIE_SECURE: "true"
          MENSALIDADES_API_BASE_URL: "http://127.0.0.1:3102"
          MENSALIDADES_API_TOKEN: local-fixture
        shell: bash
        run: |
          bash scripts/ci-048-deployment-check.sh
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complement-048-${{ matrix.scenario }}
          path: operational-048/
          if-no-files-found: warn
          retention-days: 14
