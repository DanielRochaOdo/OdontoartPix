name: Refresh security dependencies (temporary)
on:
  push:
    branches:
      - feat/associados-contatos-xlsx
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/associados-contatos-xlsx
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update vulnerable production dependencies and lockfile
        run: |
          npm install next@16.4.3 sharp@latest zod@latest source-map-js@latest
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: upgrade vulnerable production dependencies"
            git push origin HEAD:feat/associados-contatos-xlsx
          fi
