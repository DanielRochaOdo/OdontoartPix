name: Patch export layouts

on:
  push:
    branches:
      - feat/exportacoes-layout-e-valores
    paths:
      - .github/workflows/patch-export-layouts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exportacoes-layout-e-valores
          fetch-depth: 0
      - name: Apply export component patches
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/associados-card-list.tsx src/components/summary-analysis-dashboard.tsx
          git commit -m "feat: integra exportacoes estilizadas"
          git push origin HEAD:feat/exportacoes-layout-e-valores
