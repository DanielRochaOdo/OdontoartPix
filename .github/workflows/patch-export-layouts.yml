    const titleStyle = { font: { bold: true, color: { rgb: "E6FFFA" }, sz: 16 }, fill: { fgColor: { rgb: "062B2B" } }, alignment: { vertical: "center" } };
    const sectionStyle = { font: { bold: true, color: { rgb: "0F766E" } }, fill: { fgColor: { rgb: "CCFBF1" } } };
    const headerStyle = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "0F766E" } }, alignment: { vertical: "center" } };
    if (worksheet.A1) worksheet.A1.s = titleStyle;
