name: Patch export layouts

on:
  push:
    branches:
      - feat/exportacoes-layout-e-valores
    paths:
      - .github/workflows/patch-export-layouts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/exportacoes-layout-e-valores
          fetch-depth: 0

      - name: Apply export improvements
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/associados-card-list.tsx')
          text = path.read_text()
          start = text.index('  function exportFilteredRows() {')
          end = text.index('\n  async function reprocessSelected()', start)
          new_block = r'''  function exportFilteredRows() {
    if (filteredRows.length === 0) return;

    const campaignLabels = new Map(options.campaign);
    const batchLabels = new Map(options.batch);
    const appliedFilters: Array<[string, string]> = [
      ["Pesquisa geral", query.trim() || "Todos"],
      ["Código associado", codeFilter.trim() || "Todos"],
      ["Parcela", installmentFilter.trim() || "Todas"],
      ["Data de vencimento", dateLabel],
      ["Data de pagamento", paymentDateLabel],
      ["Status", statusFilters.length ? statusFilters.map(statusLabel).join(", ") : "Todos"],
      ["Pagamento", paymentFilters.length ? paymentFilters.map(paymentLabel).join(", ") : "Todos"],
      ["Pago com pendência", paidPendingFilter === "yes" ? "Sim" : paidPendingFilter === "no" ? "Não" : "Todos"],
      ["Tipo de pagamento", receiptFilters.length ? receiptFilters.join(", ") : "Todos"],
      ["Tipo de parcela", installmentTypeFilters.length ? installmentTypeFilters.join(", ") : "Todos"],
      ["Campanha", campaignFilters.length ? campaignFilters.map((id) => campaignLabels.get(id) ?? id).join(", ") : "Todas"],
      ["Lote", batchFilters.length ? batchFilters.map((id) => batchLabels.get(id) ?? id).join(", ") : "Todos"]
    ];

    const headers = [
      "Nome",
      "Código associado",
      "Parcela",
      "Vencimento",
      "CPF",
      "Campanha",
      "Lote",
      "Status",
      "Pagamento",
      "Tipo de pagamento",
      "Tipo de parcela",
      "Data de pagamento",
      "Valor (R$)",
      "Valor pago (R$)",
      "Pendência (R$)"
    ];
    const metadataRows: (string | number | null)[][] = [
      ["ODONTOPIX · ASSOCIADOS"],
      ["Exportação dos registros filtrados"],
      [`Gerado em ${new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short" }).format(new Date())}`],
      [],
      ["FILTROS APLICADOS", "CRITÉRIO"],
      ...appliedFilters,
      [],
      [`${new Intl.NumberFormat("pt-BR").format(filteredRows.length)} registro(s) exportado(s)`],
      [],
      headers
    ];
    const dataStartRow = metadataRows.length;
    const worksheet = XLSX.utils.aoa_to_sheet(metadataRows);
    XLSX.utils.sheet_add_aoa(
      worksheet,
      filteredRows.map((row) => [
        row.name,
        row.associatedCode,
        row.installment,
        row.dueDate || "",
        row.cpf ? `***.***.***-${row.cpf.slice(-2)}` : "",
        row.campaign,
        row.batch,
        row.missingInstallment ? `Erro — ${INSTALLMENT_NOT_FOUND_LABEL}` : statusLabel(row.status),
        row.paidWithPending ? "Pago com pendência" : paymentLabel(row.payment),
        row.receiptDescription,
        row.installmentType === "-" ? "" : row.installmentType,
        row.paymentDate === "-" ? "" : row.paymentDate,
        row.amount / 100,
        row.paidAmount == null ? null : row.paidAmount / 100,
        row.pending / 100
      ]),
      { origin: `A${dataStartRow + 1}` }
    );

    const lastDataRow = dataStartRow + filteredRows.length;
    const accountingFormat = '"R$" #,##0.00;[Red]-"R$" #,##0.00;"R$" -';
    for (const column of ["M", "N", "O"]) {
      for (let row = dataStartRow + 1; row <= lastDataRow; row += 1) {
        const cell = worksheet[`${column}${row}`];
        if (cell && cell.t === "n") cell.z = accountingFormat;
      }
    }

    worksheet["!merges"] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 14 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 14 } },
      { s: { r: 2, c: 0 }, e: { r: 2, c: 14 } },
      { s: { r: metadataRows.length - 3, c: 0 }, e: { r: metadataRows.length - 3, c: 14 } }
    ];
    worksheet["!autofilter"] = { ref: `A${dataStartRow}:O${lastDataRow}` };
    worksheet["!cols"] = [
      { wch: 32 }, { wch: 20 }, { wch: 16 }, { wch: 16 }, { wch: 18 }, { wch: 26 },
      { wch: 26 }, { wch: 22 }, { wch: 22 }, { wch: 30 }, { wch: 18 }, { wch: 20 },
      { wch: 18 }, { wch: 18 }, { wch: 18 }
    ];
