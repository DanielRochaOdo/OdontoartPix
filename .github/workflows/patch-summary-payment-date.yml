name: Patch resumo analise payment date

on:
  push:
    branches:
      - feat/resumo-analise-filtro-data-pagamento
    paths:
      - .github/workflows/patch-summary-payment-date.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resumo-analise-filtro-data-pagamento
          fetch-depth: 0
      - name: Apply payment date filter changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Backend metrics contract and filtering.
          path = "src/lib/summary-analysis.ts"
          replace(path,
          '''  from: string;\n  to: string;\n  campaignIds: string[];''',
          '''  from: string;\n  to: string;\n  paymentDateFrom: string;\n  paymentDateTo: string;\n  campaignIds: string[];''')
          replace(path,
          '''type SummaryAnalysisFilters = {\n  from?: string;\n  to?: string;\n  campaignIds?: string[];''',
          '''type SummaryAnalysisFilters = {\n  from?: string;\n  to?: string;\n  paymentDateFrom?: string;\n  paymentDateTo?: string;\n  campaignIds?: string[];''')
          replace(path,
          '''  const from = filters.from?.trim() ?? "";\n  const to = filters.to?.trim() ?? "";\n  const campaignIds = sanitizeIds(filters.campaignIds);\n  const batchIds = sanitizeIds(filters.batchIds);\n  validateSummaryAnalysisRange(from, to);''',
          '''  const from = filters.from?.trim() ?? "";\n  const to = filters.to?.trim() ?? "";\n  const paymentDateFrom = filters.paymentDateFrom?.trim() ?? "";\n  const paymentDateTo = filters.paymentDateTo?.trim() ?? "";\n  const campaignIds = sanitizeIds(filters.campaignIds);\n  const batchIds = sanitizeIds(filters.batchIds);\n  validateSummaryAnalysisRange(from, to);\n  validateSummaryAnalysisRange(paymentDateFrom, paymentDateTo);''')
          replace(path,
          '''         end as due_date\n       from scoped_targets''',
          '''         end as due_date,\n         case\n           when trim(coalesce(mti.payment_date_text, '')) ~ '^\\\\d{1,2}/\\\\d{1,2}/\\\\d{4}$'\n             then to_date(trim(mti.payment_date_text), 'DD/MM/YYYY')\n           when trim(coalesce(mti.payment_date_text, '')) ~ '^\\\\d{4}-\\\\d{2}-\\\\d{2}'\n             then to_date(substring(trim(mti.payment_date_text) from 1 for 10), 'YYYY-MM-DD')\n           when trim(coalesce(mti.payment_date_text, '')) ~ '^\\\\d{1,2}/\\\\d{1,2}/\\\\d{2}$'\n             then to_date(trim(mti.payment_date_text), 'MM/DD/YY')\n           else null\n         end as payment_date\n       from scoped_targets''')
          replace(path,
          '''       where ($3::date is null or due_date >= $3::date)\n         and ($4::date is null or due_date <= $4::date)''',
          '''       where ($3::date is null or due_date >= $3::date)\n         and ($4::date is null or due_date <= $4::date)\n         and ($5::date is null or payment_date >= $5::date)\n         and ($6::date is null or payment_date <= $6::date)''')
          replace(path,
          '''    [campaignIds, batchIds, from || null, to || null]''',
          '''    [campaignIds, batchIds, from || null, to || null, paymentDateFrom || null, paymentDateTo || null]''')
          replace(path,
          '''    from,\n    to,\n    campaignIds,''',
          '''    from,\n    to,\n    paymentDateFrom,\n    paymentDateTo,\n    campaignIds,''')

          # API query params.
          path = "src/app/api/resumo-analise/route.ts"
          replace(path,
          '''  const from = url.searchParams.get("from")?.trim() ?? "";\n  const to = url.searchParams.get("to")?.trim() ?? "";\n  const campaignIds = readIds(url.searchParams.get("campaignIds"));''',
          '''  const from = url.searchParams.get("from")?.trim() ?? "";\n  const to = url.searchParams.get("to")?.trim() ?? "";\n  const paymentDateFrom = url.searchParams.get("paymentDateFrom")?.trim() ?? "";\n  const paymentDateTo = url.searchParams.get("paymentDateTo")?.trim() ?? "";\n  const campaignIds = readIds(url.searchParams.get("campaignIds"));''')
          replace(path,
          '''      from,\n      to,\n      campaignIds: campaignIds.data,''',
          '''      from,\n      to,\n      paymentDateFrom,\n      paymentDateTo,\n      campaignIds: campaignIds.data,''')

          # Dashboard state, query, and UI.
          path = "src/components/summary-analysis-dashboard.tsx"
          replace(path,
          '''  const [from, setFrom] = useState(initialFrom);\n  const [to, setTo] = useState(initialTo);\n  const [campaignIds, setCampaignIds]''',
          '''  const [from, setFrom] = useState(initialFrom);\n  const [to, setTo] = useState(initialTo);\n  const [paymentDateFrom, setPaymentDateFrom] = useState(initialMetrics.paymentDateFrom);\n  const [paymentDateTo, setPaymentDateTo] = useState(initialMetrics.paymentDateTo);\n  const [paymentDatePopoverOpen, setPaymentDatePopoverOpen] = useState(false);\n  const [campaignIds, setCampaignIds]''')
          replace(path,
          '''  const periodLabel = from || to\n    ? `${from ? displayDate(from) : "início"} a ${to ? displayDate(to) : "hoje"}`\n    : "Todos os vencimentos";''',
          '''  const periodLabel = from || to\n    ? `${from ? displayDate(from) : "início"} a ${to ? displayDate(to) : "hoje"}`\n    : "Todos os vencimentos";\n  const paymentPeriodLabel = paymentDateFrom || paymentDateTo\n    ? `${paymentDateFrom ? displayDate(paymentDateFrom) : "início"} a ${paymentDateTo ? displayDate(paymentDateTo) : "hoje"}`\n    : "Todas as datas";''')
          replace(path,
          '''  async function loadFilters(next: {\n    from: string;\n    to: string;\n    campaignIds: string[];\n    batchIds: string[];\n  }) {\n    setFrom(next.from);\n    setTo(next.to);\n    setCampaignIds(next.campaignIds);''',
          '''  async function loadFilters(next: {\n    from: string;\n    to: string;\n    paymentDateFrom: string;\n    paymentDateTo: string;\n    campaignIds: string[];\n    batchIds: string[];\n  }) {\n    setFrom(next.from);\n    setTo(next.to);\n    setPaymentDateFrom(next.paymentDateFrom);\n    setPaymentDateTo(next.paymentDateTo);\n    setCampaignIds(next.campaignIds);''')
          replace(path,
          '''    if (next.from && next.to && next.from > next.to) {\n      setError("Selecione um período de vencimento válido.");\n      return;\n    }''',
          '''    if (next.from && next.to && next.from > next.to) {\n      setError("Selecione um período de vencimento válido.");\n      return;\n    }\n    if (next.paymentDateFrom && next.paymentDateTo && next.paymentDateFrom > next.paymentDateTo) {\n      setError("Selecione um período de pagamento válido.");\n      return;\n    }''')
          replace(path,
          '''    if (next.from) params.set("from", next.from);\n    if (next.to) params.set("to", next.to);\n    if (next.campaignIds.length)''',
          '''    if (next.from) params.set("from", next.from);\n    if (next.to) params.set("to", next.to);\n    if (next.paymentDateFrom) params.set("paymentDateFrom", next.paymentDateFrom);\n    if (next.paymentDateTo) params.set("paymentDateTo", next.paymentDateTo);\n    if (next.campaignIds.length)''')
          replace(path,
          '''    void loadFilters({ from, to, campaignIds: values, batchIds: nextBatchIds });''',
          '''    void loadFilters({ from, to, paymentDateFrom, paymentDateTo, campaignIds: values, batchIds: nextBatchIds });''')
          replace(path,
          '''    void loadFilters({ from, to, campaignIds, batchIds: values });''',
          '''    void loadFilters({ from, to, paymentDateFrom, paymentDateTo, campaignIds, batchIds: values });''')
          replace(path,
          '''    void loadFilters({ from: "", to: "", campaignIds: [], batchIds: [] });''',
          '''    setPaymentDatePopoverOpen(false);\n    void loadFilters({ from: "", to: "", paymentDateFrom: "", paymentDateTo: "", campaignIds: [], batchIds: [] });''')
          replace(path,
          '''      ["Resumo e Análise", periodLabel],\n      ["Campanhas",''',
          '''      ["Resumo e Análise", periodLabel],\n      ["Data de pagamento", paymentPeriodLabel],\n      ["Campanhas",''')
          replace(path,
          '''          from,\n          to,\n          dispatchUnitCostCents,''',
          '''          from,\n          to,\n          paymentDateFrom,\n          paymentDateTo,\n          dispatchUnitCostCents,''')
          replace(path,
          '''        <p className="text-xs text-muted">Os resultados seguem campanha, lote e DataVencimento.</p>''',
          '''        <p className="text-xs text-muted">Os resultados seguem campanha, lote, DataVencimento e, quando informado, Data de pagamento.</p>''')
          replace(path,
          '''        <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-5 xl:items-end">''',
          '''        <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-6 xl:items-end">''')
          replace(path,
          '''              onChange={(event) => void loadFilters({ from: event.target.value, to, campaignIds, batchIds })}''',
          '''              onChange={(event) => void loadFilters({ from: event.target.value, to, paymentDateFrom, paymentDateTo, campaignIds, batchIds })}''')
          replace(path,
          '''              onChange={(event) => void loadFilters({ from, to: event.target.value, campaignIds, batchIds })}''',
          '''              onChange={(event) => void loadFilters({ from, to: event.target.value, paymentDateFrom, paymentDateTo, campaignIds, batchIds })}''')
          replace(path,
          '''          <button type="button" onClick={clearFilters} className="rounded-lg border border-default bg-surface-secondary px-3 py-2.5 text-sm font-semibold text-secondary transition hover:bg-surface-hover hover:text-primary">\n            Limpar filtros\n          </button>''',
          '''          <div className="relative">\n            <button\n              type="button"\n              onClick={() => setPaymentDatePopoverOpen((value) => !value)}\n              className="flex min-h-[42px] w-full items-center justify-between gap-2 rounded-lg border border-default bg-surface-secondary px-3 py-2.5 text-left text-sm text-primary outline-none transition hover:bg-surface-hover focus:border-focus focus:ring-2 focus:ring-brand"\n              aria-expanded={paymentDatePopoverOpen}\n            >\n              <span className="truncate">Data de pagamento: {paymentPeriodLabel}</span>\n              <span className="shrink-0 text-muted">▾</span>\n            </button>\n            {paymentDatePopoverOpen ? (\n              <div className="absolute right-0 top-full z-50 mt-2 w-full min-w-[300px] rounded-xl border border-default bg-surface-elevated p-3 shadow-xl">\n                <div className="grid gap-3 sm:grid-cols-2">\n                  <label className="text-xs text-secondary">\n                    De\n                    <input\n                      type="date"\n                      value={paymentDateFrom}\n                      max={paymentDateTo || undefined}\n                      onChange={(event) => void loadFilters({ from, to, paymentDateFrom: event.target.value, paymentDateTo, campaignIds, batchIds })}\n                      className="mt-1 w-full rounded-lg border border-default bg-surface-secondary px-3 py-2.5 text-sm text-primary outline-none focus:border-focus focus:ring-2 focus:ring-brand"\n                    />\n                  </label>\n                  <label className="text-xs text-secondary">\n                    Até\n                    <input\n                      type="date"\n                      value={paymentDateTo}\n                      min={paymentDateFrom || undefined}\n                      onChange={(event) => void loadFilters({ from, to, paymentDateFrom, paymentDateTo: event.target.value, campaignIds, batchIds })}\n                      className="mt-1 w-full rounded-lg border border-default bg-surface-secondary px-3 py-2.5 text-sm text-primary outline-none focus:border-focus focus:ring-2 focus:ring-brand"\n                    />\n                  </label>\n                </div>\n                <div className="mt-3 flex justify-end gap-2">\n                  <button\n                    type="button"\n                    onClick={() => void loadFilters({ from, to, paymentDateFrom: "", paymentDateTo: "", campaignIds, batchIds })}\n                    className="rounded-lg px-3 py-2 text-xs font-medium text-secondary hover:bg-surface-hover"\n                  >\n                    Limpar\n                  </button>\n                  <button type="button" onClick={() => setPaymentDatePopoverOpen(false)} className="rounded-lg bg-brand px-3 py-2 text-xs font-semibold text-inverse">OK</button>\n                </div>\n              </div>\n            ) : null}\n          </div>\n          <button type="button" onClick={clearFilters} className="rounded-lg border border-default bg-surface-secondary px-3 py-2.5 text-sm font-semibold text-secondary transition hover:bg-surface-hover hover:text-primary">\n            Limpar filtros\n          </button>''')
          replace(path,
          '''        <p className="mt-3 text-xs text-muted">As datas são opcionais e filtram a DataVencimento das parcelas. Sem período definido, entram todos os vencimentos do escopo selecionado.</p>''',
          '''        <p className="mt-3 text-xs text-muted">Os períodos são opcionais. Vencimento filtra a DataVencimento; Data de pagamento filtra a DataPagamento. Sem um período definido, esse critério não restringe o resultado.</p>''')
          replace(path,
          '''                    <p className="mt-2 text-sm text-secondary">Os recebimentos PIX são separados pelo Tipo de Parcela e respeitam campanha, lote e DataVencimento.</p>''',
          '''                    <p className="mt-2 text-sm text-secondary">Os recebimentos PIX são separados pelo Tipo de Parcela e respeitam campanha, lote, DataVencimento e Data de pagamento.</p>''')

          # PDF filter metadata.
          path = "src/app/api/resumo-analise/exportar-pdf/route.ts"
          replace(path,
          '''  from: z.string(),\n  to: z.string(),\n  dispatchUnitCostCents:''',
          '''  from: z.string(),\n  to: z.string(),\n  paymentDateFrom: z.string(),\n  paymentDateTo: z.string(),\n  dispatchUnitCostCents:''')
          replace(path,
          '''    validateSummaryAnalysisRange(parsed.data.from, parsed.data.to);\n    const lines = [''',
          '''    validateSummaryAnalysisRange(parsed.data.from, parsed.data.to);\n    validateSummaryAnalysisRange(parsed.data.paymentDateFrom, parsed.data.paymentDateTo);\n    const lines = [''')
          replace(path,
          '''      { text: `Vencimento: ${periodLabel(parsed.data.from, parsed.data.to)}` },\n      { text: `Custo unitario''',
          '''      { text: `Vencimento: ${periodLabel(parsed.data.from, parsed.data.to)}` },\n      { text: `Data pagamento: ${parsed.data.paymentDateFrom || parsed.data.paymentDateTo ? periodLabel(parsed.data.paymentDateFrom, parsed.data.paymentDateTo) : "Todas as datas"}` },\n      { text: `Custo unitario''')

          # Contract tests.
          path = "tests/summary-analysis.test.ts"
          replace(path,
          '''  it("filtra os numeros por campanha e lote usando a mesma relacao canonica", () => {''',
          '''  it("adiciona Data de pagamento com o mesmo criterio opcional e inclusivo de Associados", () => {\n    const metrics = source("src/lib/summary-analysis.ts");\n    const route = source("src/app/api/resumo-analise/route.ts");\n    const dashboard = source("src/components/summary-analysis-dashboard.tsx");\n\n    expect(metrics).toContain("mti.payment_date_text");\n    expect(metrics).toContain("end as payment_date");\n    expect(metrics).toContain("($5::date is null or payment_date >= $5::date)");\n    expect(metrics).toContain("($6::date is null or payment_date <= $6::date)");\n    expect(route).toContain('url.searchParams.get("paymentDateFrom")');\n    expect(route).toContain('url.searchParams.get("paymentDateTo")');\n    expect(dashboard).toContain("Data de pagamento: {paymentPeriodLabel}");\n    expect(dashboard).toContain("paymentDatePopoverOpen");\n    expect(dashboard).toContain('paymentDateFrom: "", paymentDateTo: ""');\n  });\n\n  it("filtra os numeros por campanha e lote usando a mesma relacao canonica", () => {''')
          replace(path,
          '''    expect(dashboard).toContain("selectedBatchNames");\n    expect(pdfRoute).toContain''',
          '''    expect(dashboard).toContain("selectedBatchNames");\n    expect(dashboard).toContain("paymentDateFrom");\n    expect(dashboard).toContain("paymentDateTo");\n    expect(pdfRoute).toContain("Data pagamento:");\n    expect(pdfRoute).toContain''')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/summary-analysis.ts src/app/api/resumo-analise/route.ts src/components/summary-analysis-dashboard.tsx src/app/api/resumo-analise/exportar-pdf/route.ts tests/summary-analysis.test.ts
          git commit -m "feat: adiciona filtro de data de pagamento no resumo" || exit 0
          git push origin HEAD:feat/resumo-analise-filtro-data-pagamento
